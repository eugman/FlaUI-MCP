name: Build

# Code pushes get a cancellable hosted build; PRs and manual runs get the full offline gate.
# Documentation-only changes do not spend runner minutes.
# Release builds happen only in release.yml, on a tag.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - 'manifests/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - 'manifests/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ github.event_name == 'push' && 1 || 0 }}  # full history for the PR debt gate
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x  # test runtime
        global-json-file: global.json  # SDK
    # Formatting, analyzers (size and complexity limits) and the no-focus unit tests.
    # Integration tests are never run here: check.ps1 runs only its allowlist of offline projects.
    - name: Check
      if: github.event_name != 'push'
      run: pwsh -NoProfile -File scripts/check.ps1
      env:
        DEBT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    - name: Push build
      if: github.event_name == 'push'
      run: dotnet build src/FlaUI.Mcp/FlaUI.Mcp.csproj -c Release -p:IncludeLocalRecipes=false
