name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Lets scripts/check.ps1 confirm this repo has not edited files owned by the shared core.
    - name: Fetch the shared core
      run: |
        git remote add core https://github.com/eugman/FlaUI-MCP-Core.git
        git fetch --quiet core main
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x  # test runtime
        global-json-file: global.json  # SDK
    # Formatting, analyzers (size and complexity limits) and the no-focus unit tests.
    - name: Check
      run: pwsh -NoProfile -File scripts/check.ps1
      env:
        DEBT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for GitVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x  # test runtime
        global-json-file: global.json  # SDK

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1
      with:
        useConfigFile: true

    - name: Display Version
      run: |
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"

    - name: Restore dependencies
      run: dotnet restore FlaUI.Mcp.slnx

    - name: Build
      run: |
        dotnet build src/FlaUI.Mcp.Te3/FlaUI.Mcp.Te3.csproj `
          --configuration Release `
          --no-restore `
          -p:Version=${{ steps.gitversion.outputs.semVer }}

    - name: Publish
      run: |
        # The generic server and the TE3 tools ship together.
        foreach ($project in 'src/FlaUI.Mcp/FlaUI.Mcp.csproj', 'src/FlaUI.Mcp.Te3/FlaUI.Mcp.Te3.csproj') {
          dotnet publish $project `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            --output ./publish/${{ matrix.runtime }} `
            -p:Version=${{ steps.gitversion.outputs.semVer }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlaUI-MCP-Te3-${{ matrix.runtime }}
        path: ./publish/${{ matrix.runtime }}/
