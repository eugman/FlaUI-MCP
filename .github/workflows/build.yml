name: Build

# Lean on purpose: one Windows job that runs the same offline gate as the pre-push hook.
# Release builds happen only in release.yml, on a tag.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - 'manifests/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - 'manifests/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the known-debt check compares with DEBT_BASE
    # Lets scripts/check.ps1 confirm this repo has not edited files owned by the shared core.
    # Full core/main history: the gate needs `git merge-base HEAD core/main`.
    - name: Fetch the shared core
      run: |
        git remote add core https://github.com/eugman/FlaUI-MCP-Core.git
        git fetch --quiet --no-tags core main
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x  # test runtime
        global-json-file: global.json  # SDK
    # Formatting, analyzers (size and complexity limits) and the no-focus unit tests.
    # Integration tests are never run here: check.ps1 runs only its allowlist of offline projects.
    - name: Check
      run: pwsh -NoProfile -File scripts/check.ps1
      env:
        DEBT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
