name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create, for example v0.1.1'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a prerelease'
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    strategy:
      matrix:
        include:
          - runtime: win-x64
            artifact_name: FlaUI-MCP-Te3-win-x64

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine release version
      id: release
      shell: pwsh
      env:
        INPUT_TAG: ${{ inputs.tag_name }}
      run: |
        if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
          $tag = $env:INPUT_TAG
        } else {
          $tag = $env:GITHUB_REF_NAME
        }

        if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
          throw "Release tag must look like v1.2.3 or v1.2.3-prerelease; got '$tag'."
        }

        $version = $tag.Substring(1)
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Verify requested tag matches checkout
      shell: pwsh
      env:
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
      run: pwsh -NoProfile -File scripts/verify-release-tag.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:GITHUB_SHA

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x  # test runtime
        global-json-file: global.json  # SDK

    - name: Restore dependencies
      run: dotnet restore FlaUI.Mcp.slnx

    - name: Publish self-contained
      run: |
        # The generic server and the TE3 tools ship together.
        foreach ($project in 'src/FlaUI.Mcp/FlaUI.Mcp.csproj', 'src/FlaUI.Mcp.Te3/FlaUI.Mcp.Te3.csproj') {
          dotnet publish $project `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            --output ./publish/self-contained `
            -p:Version=${{ steps.release.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Publish framework-dependent
      run: |
        # The generic server and the TE3 tools ship together.
        foreach ($project in 'src/FlaUI.Mcp/FlaUI.Mcp.csproj', 'src/FlaUI.Mcp.Te3/FlaUI.Mcp.Te3.csproj') {
          dotnet publish $project `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained false `
            --output ./publish/framework-dependent `
            -p:Version=${{ steps.release.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Create ZIP archives
      run: |
        Compress-Archive -Path ./publish/self-contained/* -DestinationPath ./${{ matrix.artifact_name }}-${{ steps.release.outputs.version }}-self-contained.zip
        Compress-Archive -Path ./publish/framework-dependent/* -DestinationPath ./${{ matrix.artifact_name }}-${{ steps.release.outputs.version }}.zip
      shell: pwsh

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.runtime }}
        path: ./*.zip

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine release version
      id: release
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag_name }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          tag="$INPUT_TAG"
          draft="$INPUT_DRAFT"
          prerelease="$INPUT_PRERELEASE"
        else
          tag="${GITHUB_REF_NAME}"
          draft="false"
          prerelease="false"
        fi

        if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Release tag must look like v1.2.3 or v1.2.3-prerelease; got '$tag'." >&2
          exit 1
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        echo "draft=$draft" >> "$GITHUB_OUTPUT"
        echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

    - name: Verify requested tag matches checkout
      shell: pwsh
      env:
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
      run: pwsh -NoProfile -File scripts/verify-release-tag.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:GITHUB_SHA

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: release-*
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: FlaUI-MCP for Tabular Editor 3 ${{ steps.release.outputs.tag }}
        body: |
          ## FlaUI-MCP for Tabular Editor 3 ${{ steps.release.outputs.tag }}
          
          The generic FlaUI MCP server (`FlaUI.Mcp.exe`) and the Tabular Editor 3 tools and runner (`FlaUI.Mcp.Te3.exe`).
          
          ### Downloads
          
          | Platform | Self-contained | Framework-dependent |
          |----------|---------------|---------------------|
          | Windows x64 | `FlaUI-MCP-Te3-win-x64-*-self-contained.zip` | `FlaUI-MCP-Te3-win-x64-*.zip` |
          
          - **Self-contained**: Includes .NET runtime, no prerequisites needed
          - **Framework-dependent**: Requires the .NET 8 Desktop Runtime
          
          ### Installation
          
          1. Download and extract the appropriate ZIP for your platform
          2. Add to your MCP config:
          ```json
          {
            "mcpServers": {
              "windows": { "command": "C:/path/to/FlaUI.Mcp.exe" },
              "te3": { "command": "C:/path/to/FlaUI.Mcp.Te3.exe", "args": ["mcp"] }
            }
          }
          ```
          
          See the [README](https://github.com/eugman/FlaUI-MCP#readme) and [automation/README.md](https://github.com/eugman/FlaUI-MCP/blob/main/automation/README.md) for the TE3 server (`FlaUI.Mcp.Te3.exe` with the argument `mcp`).
        files: artifacts/*.zip
        draft: ${{ steps.release.outputs.draft }}
        prerelease: ${{ steps.release.outputs.prerelease }}
